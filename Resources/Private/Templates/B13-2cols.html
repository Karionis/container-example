<f:comment>
    <f:if condition="{childrenLeft}">
        <div class="left-children">
            <f:for each="{childrenLeft}" as="child">
                {child.data.my_mod_header}
                <f:for each="{child.uploads}" as="upload">
                    {upload.identifier}
                </f:for>
            </f:for>
        </div>
    </f:if>
</f:comment>

<div class="container">
    <div class="row">
        <div class="col">
            <f:for each="{children_110}" as="element">
                {element.renderedContent -> f:format.raw()}
            </f:for>
        </div>
        <div class="col">
            <f:for each="{children_120}" as="element">
                {element.renderedContent -> f:format.raw()}
            </f:for>
        </div>
    </div>
</div>
